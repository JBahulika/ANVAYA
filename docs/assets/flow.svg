<svg xmlns="http://www.w3.org/2000/svg" width="720" height="88" viewBox="0 0 720 88" role="img" aria-label="Show, ask, hear">
  <style>
    .card { fill: #f3eef8; stroke: #6b4f9a; stroke-width: 2; }
    .label { fill: #3a2a55; font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 700; }
    .sub { fill: #6b5a82; font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; }
    .arrow { fill: none; stroke: #8b6bb8; stroke-width: 3; stroke-linecap: round; }
    .dot { fill: #8b6bb8; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .slide1 { animation: slide 2.4s ease-in-out infinite; }
    .slide2 { animation: slide 2.4s ease-in-out 0.4s infinite; }
    .slide3 { animation: slide 2.4s ease-in-out 0.8s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(6px); }
    }
    @keyframes slide {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
  </style>

  <g class="slide1">
    <rect class="card" x="16" y="14" rx="16" width="180" height="60"/>
    <text class="label" x="106" y="42" text-anchor="middle">1 · Show</text>
    <text class="sub" x="106" y="60" text-anchor="middle">bill to the camera</text>
  </g>

  <path class="arrow pulse" d="M206 44 H246"/>
  <circle class="dot pulse" cx="250" cy="44" r="4"/>

  <g class="slide2">
    <rect class="card" x="270" y="14" rx="16" width="180" height="60"/>
    <text class="label" x="360" y="42" text-anchor="middle">2 · Ask</text>
    <text class="sub" x="360" y="60" text-anchor="middle">how much is due?</text>
  </g>

  <path class="arrow pulse" d="M460 44 H500"/>
  <circle class="dot pulse" cx="504" cy="44" r="4"/>

  <g class="slide3">
    <rect class="card" x="524" y="14" rx="16" width="180" height="60"/>
    <text class="label" x="614" y="42" text-anchor="middle">3 · Hear</text>
    <text class="sub" x="614" y="60" text-anchor="middle">amount + due date</text>
  </g>
</svg>
